name: Windows build and checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'tests/**'
      - 'samples/**'
      - 'scripts/**'
      - '**/*.csproj'
      - '**/packages.lock.json'
      - 'Directory.Build.props'
      - 'global.json'
      - '.gitattributes'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'tests/**'
      - 'samples/**'
      - 'scripts/**'
      - '**/*.csproj'
      - '**/packages.lock.json'
      - 'Directory.Build.props'
      - 'global.json'
      - '.gitattributes'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build native Windows components
        run: |
          $candidate = Join-Path $env:GITHUB_WORKSPACE "artifacts/native-candidates/ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./scripts/build-native.ps1 -Configuration Release -OutputDirectory $candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $candidate 'GlassDesk.Native.dll'))) { throw 'GlassDesk.Native.dll was not produced.' }
          "GLASSDESK_NATIVE_DIR=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore and publish the self-contained application
        run: |
          dotnet restore src/GlassDesk.App/GlassDesk.App.csproj -r win-x64 --locked-mode "-p:GlassDeskNativeDirectory=$env:GLASSDESK_NATIVE_DIR" -m:1 -p:BuildInParallel=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/GlassDesk.App/GlassDesk.App.csproj -c Release -r win-x64 --self-contained true --no-restore -p:GlassDeskUiPreview=false -p:PublishSingleFile=false -p:PublishTrimmed=false "-p:GlassDeskNativeDirectory=$env:GLASSDESK_NATIVE_DIR" -m:1 -p:BuildInParallel=false -o artifacts/ci/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path artifacts/ci/publish/GlassDesk.exe)) { throw 'GlassDesk.exe was not published.' }
      - name: Build archived SDK compatibility fixture
        run: |
          dotnet restore tests/Fixtures/LegacyPlugin/GlassDesk.LegacyPlugin.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/Fixtures/LegacyPlugin/GlassDesk.LegacyPlugin.csproj -c Release --no-restore -m:1 -p:BuildInParallel=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run isolated console checks
        run: |
          $projects = @('GlassDesk.Core.Tests', 'GlassDesk.PlatformChecks', 'GlassDesk.PluginChecks')
          foreach ($project in $projects) {
            $projectPath = "tests/$project/$project.csproj"
            dotnet restore $projectPath -r win-x64 --locked-mode "-p:GlassDeskNativeDirectory=$env:GLASSDESK_NATIVE_DIR"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet run --project $projectPath -c Release --no-restore "-p:GlassDeskNativeDirectory=$env:GLASSDESK_NATIVE_DIR" -- --no-stress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }



